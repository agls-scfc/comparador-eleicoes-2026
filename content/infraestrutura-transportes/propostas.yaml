  candidato: flavio-bolsonaro
  eixo: infraestrutura-transportes
  topico: regras-concessoes-e-financiamento
  rotulo: Fixar prazo para licenciamento e conceder a licença se o órgão não decidir no prazo
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 49
    secao: 'Brasil que Cresce > Segurança jurídica: a regra do início é a regra do fim'
    literal: 'Parte essencial de mudar essa lógica é um licenciamento ambiental ágil, moderno e com segurança jurídica: grandes obras, usinas, minas e projetos industriais vivem parados anos à espera de uma licença, e cada mês de atraso é investimento que foge e emprego que não vem. Vamos assegurar regras claras, prazos definidos e critérios técnicos, com a certeza de que agilidade e responsabilidade ambiental caminham juntas. O prazo tem que valer para os'
  - documento: plano-pl-2026
    pagina_impressa: 50
    secao: 'Brasil que Cresce > Segurança jurídica: a regra do início é a regra do fim'
    literal: dois lados. Quando o empreendedor cumpre a lei e apresenta tudo o que a norma exige, o órgão responsável deve ter um prazo definido para concluir a análise. Se não decidir nem se manifestar dentro desse prazo, a licença deve ser concedida, porque a demora do Estado não pode ser um castigo para quem fez a sua parte.
  meta: null
  condicionalidade: null
