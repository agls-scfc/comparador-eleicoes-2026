- id: pt-infraestrutura-transportes-003
  candidato: lula
  eixo: infraestrutura-transportes
  topico: planejamento-e-investimento
  rotulo: 'Novo PAC: R$ 280 bilhões em infraestrutura em 2025 e R$ 1,3 trilhão executado'
  tipo: resultado_declarado
  trechos:
  - documento: plano-pt-2026
    pagina_impressa: 53
    secao: 8. Promover uma Economia Mais Sustentável, Produtiva e Digital, Para Todas e Todos > Investimentos em logística
    literal: O Novo PAC alcançou o objetivo de retomar os investimentos públicos e privados em infraestrutura no País. No ano de 2025, alcançamos o recorde de investimento em infraestrutura, R$ 280 bilhões e devemos fechar 2026 com nova marca ainda maior, R$ 300 bilhões. Ao organizar a carteira de investimentos estratégicos, o Novo PAC orientou as expectativas dos agentes públicos e privados e desencadeou um ciclo virtuoso de investimento. Os dados de execução apontam a realização de R$1,3 trilhão, com empreendimentos que chegaram a 99% dos municípios.
  meta: null
  condicionalidade: null
