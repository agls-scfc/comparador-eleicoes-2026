- id: pt-infraestrutura-transportes-009
  candidato: lula
  eixo: infraestrutura-transportes
  topico: desenvolvimento-regional-e-nordeste
  rotulo: Atrair ao Nordeste indústrias eletrointensivas, inclusive de minerais críticos
