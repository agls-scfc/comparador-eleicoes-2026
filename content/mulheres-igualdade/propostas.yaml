    literal: A Central da Mulher será um espaço físico onde a mulher resolve a vida sem perder tempo nem percorrer a cidade inteira. Nela, encontrará acolhimento e proteção, orientação jurídica e apoio psicológico, saúde preventiva, qualificação e cadastramento, a possibilidade de se candidatar a vagas de emprego, orientação para abrir o próprio negócio, crédito, renegociação de dívidas, regularização da casa e acesso a benefícios. Vamos abrir essas centrais em todo o Brasil, em parceria com estados e municípios, em imóveis da União e em conjunto com o Sistema S e instituições públicas e privadas.
  meta: null
  condicionalidade: null
