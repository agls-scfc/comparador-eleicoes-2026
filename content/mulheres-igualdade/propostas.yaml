    pagina_impressa: 17
    secao: Brasil por Elas > Central da Mulher
    literal: E teremos unidades itinerantes, como caminhões adaptados que percorrerão o país de ponta a ponta e, onde for preciso, barcos adaptados para atender a população ribeirinha e mais distante.
