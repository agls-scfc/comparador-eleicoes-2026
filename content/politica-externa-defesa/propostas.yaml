  rotulo: 'Novo PAC: R$ 20,4 bilhões em defesa, caças Gripen, KC-390, fragatas e blindados'
  tipo: resultado_declarado
  trechos:
  - documento: plano-pt-2026
    pagina_impressa: 78
    secao: 13. Defender a soberania nacional e o protagonismo internacional do Brasil
    literal: Com o Novo PAC, o Brasil tem alavancado fortemente os investimentos na área de Defesa. Desde 2023 já foram executados R$ 20,4 bilhões em projetos estratégicos. Entregamos 7 caças gripens-F-39, tendo sido produzida a primeira aeronave em solo brasileiro este ano. Adquirimos 3 cargueiros KC-390 fabricados no país. Estamos construindo 4 fragatas, a primeira já em operação. Produzimos 226 viaturas blindadas.
