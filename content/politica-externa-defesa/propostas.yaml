    literal: Na política externa, o Brasil deverá ser cada vez mais independente, ativo e comprometido com a integração regional e com a afirmação da América do Sul e do Caribe como zona de paz. A integração sul-americana é o primeiro círculo de projeção estratégica do Brasil. Seguiremos aprofundando o Mercosul e os espaços de integração regional, especialmente nas áreas de infraestrutura, defesa, segurança pública, energia e saúde. Consolidaremos o Mercosul como principal plataforma de integração econômica, produtiva, política e social da América do Sul.
