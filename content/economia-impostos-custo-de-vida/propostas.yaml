- id: pt-economia-impostos-custo-de-vida-008
  candidato: lula
  eixo: economia-impostos-custo-de-vida
  topico: crescimento-e-industria
  rotulo: Fortalecer a neoindustrialização e integrar política industrial, científica e comercial
  tipo: compromisso
  trechos:
  - documento: plano-pt-2026
    pagina_impressa: 50
    secao: 8. Promover uma Economia Mais Sustentável, Produtiva e Digital, Para Todas e Todos > Indústria ainda mais forte, inovadora e verde
    literal: 'No próximo ciclo governamental, nosso objetivo central será aprimorar e fortalecer a neoindustrialização, repensando o papel da indústria no Brasil a partir das prioridades da sociedade, de suas contribuições para a melhoria das condições de vida das pessoas, para a geração de empregos decentes e para a prosperidade econômica. O foco estratégico está na inovação, IA, minerais críticos e outros ativos capazes de colocar o Brasil de uma vez por todas como protagonista em áreas portadoras de futuro. Vamos continuar integrando as políticas industrial, científica, tecnológica, de inovação e de comércio exterior, combinando cinco objetivos centrais: elevar a produtividade, agregar valor às cadeias produtivas, fortalecer a soberania tecnológica, gerar empregos qualificados e descarbonizar a economia.'
  meta: null
  condicionalidade: null
- id: pt-economia-impostos-custo-de-vida-009
  candidato: lula
  eixo: economia-impostos-custo-de-vida
  topico: crescimento-e-industria
  rotulo: Instrumentos de apoio à indústria com preferência a empresas brasileiras
