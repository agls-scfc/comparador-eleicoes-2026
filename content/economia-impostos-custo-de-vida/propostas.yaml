    pagina_impressa: 31
    secao: Brasil Mais Barato > Comida mais barata na prateleira
    literal: Vamos também ampliar a capacidade de armazenamento das safras, hoje insuficiente para o que o país produz.
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-005
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: custo-de-vida
  rotulo: Apoiar a produção nacional de fertilizantes
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 32
    secao: Brasil Mais Barato > Comida mais barata na prateleira
    literal: Vamos apoiar a produção nacional de fertilizantes, com os minerais que o Brasil possui, como o potássio e o fosfato, para que a mesa do brasileiro não dependa do que acontece do outro lado do mundo.
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-006
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: custo-de-vida
  rotulo: Proibir apostas com recursos de programas sociais e ampliar a orientação financeira
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 33
    secao: Brasil Mais Barato > Crédito que não afunda a família
    literal: Vamos proibir o uso dos recursos dos programas sociais para apostas, porque dinheiro destinado a pôr comida na mesa não pode escoar para a casa de apostas, e promover campanhas educativas e de conscientização sobre os riscos do endividamento com jogos. E vamos ampliar a orientação financeira, pela rede da CAIXA, para que o brasileiro aprenda a sair do vermelho, organizar o orçamento e começar a poupar.
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-007
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: fiscal-juros-inflacao
  rotulo: Reduzir a dívida pública para aproximar os juros da média internacional
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 33
    secao: Brasil Mais Barato > Crédito que não afunda a família
    literal: Ao estabilizar e reduzir a dívida pública, nosso governo vai criar as condições para que os juros básicos fiquem em linha com a média internacional e para que a inflação volte ao centro da meta.
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-008
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: fiscal-juros-inflacao
  rotulo: Reformular as regras fiscais, buscar superávits e limitar crédito subsidiado do Tesouro
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 71
    secao: Brasil que Não Volta Atrás > Contas em ordem para juros e inflação menores
    literal: 'Vamos fazer o oposto: faremos nossos gastos caberem no orçamento, o que permitirá cobrar menos impostos e não empurrará dívida para as próximas gerações. Apresentaremos uma reformulação nas atuais regras fiscais, com regras claras focadas na estabilização e na redução da dívida pública conforme determina a Constituição. Vamos construir o equilíbrio fiscal duradouro, entregando superávits primários e limitando o crédito subsidiado com recursos do Tesouro, mitigando pressões inflacionárias. E haverá uma regra clara de controle de gastos discricionários dos três Poderes da União.'
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-009
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: estado-e-gestao
  rotulo: Choque de gestão, reforma do processo orçamentário e avaliação de políticas públicas
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 71
    secao: Brasil que Não Volta Atrás > Contas em ordem para juros e inflação menores
    literal: Junto disso, um choque de gestão vai colocar o patrimônio público a serviço da sociedade, com reforma do processo orçamentário e uma agenda permanente de transparência e avaliação de políticas públicas, identificando quem são os beneficiários de cada programa e medindo o impacto real de cada gasto.
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-010
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: estado-e-gestao
  rotulo: 'Tesouraço: cortar gastos e reduzir impostos sobre quem produz'
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 68
    secao: Brasil que Não Volta Atrás
    literal: 'Nossa bandeira é um grande TESOURAÇO: um corte profundo e por todos os lados, que enxuga a máquina, coloca as contas em ordem e reduz os impostos que pesam sobre quem produz.'
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-011
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: estado-e-gestao
  rotulo: Reforma administrativa e corte de no mínimo 10 ministérios
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 69
    secao: Brasil que Não Volta Atrás > Enxugar a Máquina e Profissionalizar a Gestão Pública
    literal: 'Daremos continuidade à reforma administrativa que já colocamos em discussão, para modernizar o funcionamento do Estado e a carreira do servidor. E faremos uma ampla revisão normativa infralegal, na gestão pública e nas áreas tributária, previdenciária e trabalhista, que elimine o excesso de regras que trava a economia e encarece a máquina. Isso inclui o corte de no mínimo 10 ministérios, a redução de cargos comissionados e de despesas administrativas e o combate aos penduricalhos e supersalários que corroem o orçamento, tudo com um objetivo: mais eficiência e racionalidade para servir à sociedade.'
  meta:
