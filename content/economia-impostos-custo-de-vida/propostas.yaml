    secao: 8. Promover uma Economia Mais Sustentável, Produtiva e Digital, Para Todas e Todos > Crescimento com Inclusão e Estabilidade
    literal: Além disso, seguiremos monitorando a evolução do endividamento das famílias e das empresas, assegurando a continuidade dos fundos garantidores, mantendo os mecanismos de controle de gastos excessivos em apostas on-line e aprimorando as regras de oferta e responsabilidade na concessão de crédito, conferindo maior proteção aos consumidores.
