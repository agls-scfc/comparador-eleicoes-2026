    pagina_impressa: 48
    secao: 8. Promover uma Economia Mais Sustentável, Produtiva e Digital, Para Todas e Todos > Crescimento com Inclusão e Estabilidade
    literal: Para isso, vamos elevar a taxa de investimento da economia. Ampliar os investimentos em infraestrutura logística, para dar mais competitividade à produção nacional, e em infraestrutura social, para aprimorar os serviços e os cuidados básicos prestados à população. Também continuaremos a incentivar os investimentos privados na indústria, com foco em inovação e em setores portadores de futuro, para que o Brasil avance posições na corrida tecnológica global.
