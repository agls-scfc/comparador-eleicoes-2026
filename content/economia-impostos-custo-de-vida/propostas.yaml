- id: pl-economia-impostos-custo-de-vida-001
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: tributacao
  rotulo: Rever a reforma tributária, reduzir o IVA e reduzir a carga sobre produção e consumo
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 30
    secao: Brasil Mais Barato > Menos imposto no que você consome
    literal: 'Vamos promover a revisão e o redimensionamento da reforma tributária em curso e da majoração de impostos efetuada pelo atual governo, com o objetivo de reduzir efetivamente a carga sobre a produção e o consumo. Vamos corrigir suas distorções, reduzir o IVA, hoje projetado num dos patamares mais altos do mundo, e assegurar a não cumulatividade, para que não se cobre imposto sobre imposto. Assim a reforma fica mais equilibrada, preservando a simplificação e a aderência às melhores práticas internacionais. O esforço de simplificação continuará: menos impostos, legislação unificada, desoneração das exportações e dos investimentos e redução das exceções, para que grupos parecidos paguem impostos parecidos.'
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-002
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: custo-de-vida
  rotulo: Simplificar a conta de luz e reduzir impostos sobre energia elétrica e combustíveis
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 31
    secao: Brasil Mais Barato > Conta de luz mais simples e mais barata
    literal: 'Vamos simplificar a conta de luz, racionalizando encargos e subsídios cruzados, e promover a redução gradual da CDE e das fontes incentivadas, mantida a tarifa social para quem mais precisa dela. Vamos reduzir impostos sobre energia elétrica e combustíveis, buscar segurança energética ao menor preço possível para o consumidor e regular as diversas fontes com um único norte: o menor preço final para quem paga a conta.'
  meta: null
  condicionalidade: null
- id: pl-economia-impostos-custo-de-vida-003
  candidato: flavio-bolsonaro
  eixo: economia-impostos-custo-de-vida
  topico: custo-de-vida
  rotulo: Corredores Logísticos Inteligentes e ampliação do Seguro Rural
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 31
    secao: Brasil Mais Barato > Comida mais barata na prateleira
    literal: 'Vamos criar os Corredores Logísticos Inteligentes, com foco direto na redução do custo de transporte, e ampliar o Seguro Rural, dando previsibilidade a quem planta: safra protegida é oferta garantida, e oferta garantida é preço estável.'
  meta: null
  condicionalidade: null
