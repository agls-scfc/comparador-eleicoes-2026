    pagina_impressa: 49
    secao: 8. Promover uma Economia Mais Sustentável, Produtiva e Digital, Para Todas e Todos > Crescimento com Inclusão e Estabilidade
    literal: Vamos também garantir a estabilidade e a saúde do sistema financeiro nacional por meio do fortalecimento dos órgãos de regulação, fiscalização e controle. E vamos aprofundar o mercado de capitais doméstico – aprimorando o uso das debêntures de infraestrutura, dos fundos de investimento em participações e do mercado secundário de recebíveis – e ampliar a atuação de investidores institucionais como financiadores de longo prazo.
