    secao: 8. Promover uma Economia Mais Sustentável, Produtiva e Digital, Para Todas e Todos > Indústria ainda mais forte, inovadora e verde
    literal: Seguiremos fortalecendo os instrumentos de apoio à indústria. Utilizaremos financiamento direcionado, com soluções inovadoras de parceria entre crédito público e privado, compras públicas, concessões, regulações e benefícios condicionados a conteúdo local, valor agregado nacional, margens de preferência com estímulos para empresas brasileiras.
  meta: null
  condicionalidade: null
