    pagina_impressa: 23
    secao: Brasil sem Fila
    literal: Foi também o governo Bolsonaro que realizou o leilão do 5G, um dos maiores do mundo, trazendo ao país a rede de nova geração sobre a qual todos esses serviços passam a funcionar.
  meta: null
  condicionalidade: null
