- id: pl-tecnologia-governo-digital-019
  candidato: flavio-bolsonaro
  eixo: tecnologia-governo-digital
  topico: servicos-publicos-digitais
  rotulo: Gov.br com 4,9 mil serviços e país em 7º lugar em governo digital (Banco Mundial)
  tipo: resultado_declarado
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 23
    secao: Brasil sem Fila
    literal: 'O governo do Presidente Jair Bolsonaro transformou o Brasil em uma referência mundial em governo digital: o Banco Mundial classificou o país como o sétimo do mundo em maturidade de governo digital, à frente de todas as nações das Américas, incluindo Estados Unidos e Canadá. A plataforma Gov.br chegou a 4,9 mil serviços do Governo Federal, com 75% deles totalmente digitalizados.'
  meta: null
  condicionalidade: null
- id: pl-tecnologia-governo-digital-020
  candidato: flavio-bolsonaro
  eixo: tecnologia-governo-digital
  topico: servicos-publicos-digitais
  rotulo: PIX, Carteira de Trabalho Digital, prova de vida pelo celular e registros on-line
  tipo: resultado_declarado
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 23
    secao: Brasil sem Fila
    literal: O PIX deu a milhões de brasileiros um meio de pagamento instantâneo e gratuito, dispensando taxas bancárias. A Carteira de Trabalho Digital foi baixada por 65 milhões de brasileiros, e o seguro-desemprego passou a ser solicitado pelo próprio aplicativo. O idoso passou a fazer prova de vida pelo celular, sem sair de casa. E o Sistema Eletrônico dos Registros Públicos abriu caminho para que registros e consultas em cartório sejam feitos pela internet.
  meta: null
  condicionalidade: null
- id: pl-tecnologia-governo-digital-021
  candidato: flavio-bolsonaro
  eixo: tecnologia-governo-digital
  topico: conectividade-inclusao-digital
  rotulo: Leilão do 5G realizado no governo Bolsonaro
  tipo: resultado_declarado
  trechos:
