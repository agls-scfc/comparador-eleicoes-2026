    pagina_impressa: 44
    secao: 7. Fortalecer o direito à cidade
    literal: Com uma carteira de projetos de R$ 118 bilhões no Novo PAC, a infraestrutura urbana voltou a receber atenção para assegurar um desenvolvimento urbano inclusivo, com base em cidades mais inteligentes, sustentáveis e resilientes. Fizemos isto recuperando a institucionalidade responsável pela política urbana no Governo Federal, recriando o Ministério das Cidades, e reinstituindo o diálogo com setor produtivo, movimentos sociais e estados e municípios, do que é exemplar a retomada da Conferência Nacional das Cidades.
