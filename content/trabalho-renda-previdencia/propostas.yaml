    literal: Estamos seguros de que, no próximo mandato, concluiremos o processo de modernização e aprimoramento da prestação dos serviços previdenciários. Vamos continuar, em diálogo com a sociedade, a aprimorar a política de acesso e buscar reestruturar a base de financiamento da Previdência, buscando a diversidade das fontes de custeio. Queremos construir mecanismos contributivos mais flexíveis, capazes de acompanhar trajetórias ocupacionais descontínuas e múltiplas, permitindo que a pessoa que trabalha mantenha sua proteção ao longo de toda a vida laboral.
