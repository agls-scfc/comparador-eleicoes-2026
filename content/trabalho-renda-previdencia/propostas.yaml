    pagina_impressa: 76
    secao: 12. Valorizar o Trabalho em suas Múltiplas Formas
    literal: Reconhecendo a importância do trabalho autônomo e do empreendedorismo no Brasil, o atual mandato do Presidente Lula criou linhas de crédito com juros mais baixos e garantia para os empreendedores individuais e para os micro e pequenos negócios. Criou o Contrata+ Brasil, plataforma que permite a estes trabalhadores participarem do mercado de compras públicas. Elevou a faixa de faturamento para o MEI e criou linhas de crédito para que trabalhadores de transporte por aplicativos consigam adquirir veículos e motos.
