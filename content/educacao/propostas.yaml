    literal: Daremos sequência ao fomento ao ensino superior no próximo mandato. Além de concluir as obras em curso, inclusive dos novos campi, será concluída a implantação da nova unidade do ITA, no Ceará, e da Universidade Indígena e da Universidade do Esporte. Haverá também novo ciclo expansão e interiorização da educação superior pública para superar os vazios educacionais e as assimetrias regionais. Adotaremos medidas para aperfeiçoar a assistência estudantil, para garantir a permanência e a conclusão dos cursos pelos estudantes nas instituições públicas.
