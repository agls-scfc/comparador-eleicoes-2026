- id: pl-educacao-001
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: alfabetizacao-e-aprendizagem
  rotulo: Priorizar o método fônico na alfabetização
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: O começo de tudo é alfabetizar direito. Vamos priorizar o método fônico, que é o de melhor resultado comprovado pela ciência, ensinando a criança a ligar cada som à sua letra, em vez das abordagens que fracassaram por décadas.
  meta: null
  condicionalidade: null
- id: pl-educacao-002
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: alfabetizacao-e-aprendizagem
  rotulo: 'Criar o Programa Acolher: reforço escolar remunerado entre alunos'
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: 'E, para o aluno com dificuldade ao longo do ensino fundamental, vamos criar o Programa Acolher: um aluno com bom desempenho é remunerado para dar reforço aos colegas que precisam, de forma remota ou presencial. Todos ganham, quem precisa recebe ajuda de alguém próximo, que fala a sua língua, e quem ajuda ganha uma renda e aprende ainda mais ao ensinar. O objetivo é claro: ninguém avança de série sem ter aprendido.'
  meta: null
  condicionalidade: null
- id: pl-educacao-003
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: professores-e-gestao
  rotulo: Gestão por indicadores e financiamento por resultados de aprendizagem
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: A escola será cobrada pelo que existe para fazer. A gestão passa a ser baseada em indicadores de resultado e proficiência, e o financiamento seguirá o orçamento por resultados, com repasses vinculados a metas de aprendizagem, sem abandonar regiões que enfrentam maiores dificuldades.
  meta: null
  condicionalidade: null
- id: pl-educacao-004
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: professores-e-gestao
  rotulo: Qualificação contínua de professores baseada em evidências científicas
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: Os professores terão qualificação contínua baseada em evidências científicas, e não em modismos pedagógicos, com formação que os prepare para ensinar bem, e não para militar em sala de aula.
  meta: null
  condicionalidade: null
- id: pl-educacao-005
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: escola-e-curriculo
  rotulo: Educação livre de doutrinação político-partidária
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: A educação será orientada pelo conhecimento e livre de doutrinação político-partidária, respeitando a liberdade de consciência e o papel das famílias. Escola é lugar de aprender a pensar, não de aprender o que pensar, e quem decide sobre os valores que o filho recebe são os pais.
  meta: null
  condicionalidade: null
- id: pl-educacao-006
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: escola-e-curriculo
  rotulo: Ampliar as Escolas Cívico-Militares e implementar a política de altas habilidades
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: 'Vamos ampliar as Escolas Cívico-Militares, que uniram disciplina e bom desempenho onde foram implantadas, e garantir atendimento ao aluno com altas habilidades, que hoje se perde por falta de estímulo: a política nacional que trata do tema é lei mas segue sem implementação, e nós vamos tirá-la do papel.'
  meta: null
  condicionalidade: null
- id: pl-educacao-007
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: infraestrutura-e-tecnologia
  rotulo: Levar robótica, computadores, tablets e internet às escolas e ensinar economia digital
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: Vamos ainda levar robótica, computadores, tablets e internet às escolas, e incluir no currículo competências para a economia digital, preparando o jovem para lidar com o próprio dinheiro, empreender e usar as novas tecnologias, entre elas a inteligência artificial.
  meta: null
  condicionalidade: null
- id: pl-educacao-008
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: creche-e-tempo-integral
  rotulo: Apoiar a escola em tempo integral e manter escolas abertas nas férias
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 35
    secao: Brasil que Prepara > Ensinar de verdade
    literal: Apoiamos a escola em tempo integral, para que a criança tenha mais tempo de aprendizado, reforço e atividades formativas, e não fique entregue à própria sorte no contraturno. Manteremos as escolas abertas nas férias com o Escola
  - documento: plano-pl-2026
    pagina_impressa: 36
    secao: Brasil que Prepara > Ensinar de verdade
    literal: nas Férias, oferecendo esporte, arte, música e literatura em vez de deixar a criança ociosa.
  meta: null
  condicionalidade: null
- id: pl-educacao-009
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: acesso-e-permanencia
  rotulo: Voucher educacional onde faltar vaga na rede pública
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 36
    secao: Brasil que Prepara > Ensinar de verdade
    literal: E onde faltar vaga na rede pública, a família receberá um voucher educacional para matricular o filho em outra escola, porque a prioridade é a criança aprender, não a defesa de um sistema que falhou com ela.
  meta: null
  condicionalidade: null
- id: pl-educacao-010
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: creche-e-tempo-integral
  rotulo: Ampliar creches em período integral e criar o voucher-creche
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 21
    secao: Brasil por Elas > Creche garantida para toda criança
    literal: Vamos ampliar a oferta de creches para as crianças desde a primeira infância, em período integral, com alimentação digna e foco no desenvolvimento infantil. Onde não houver vaga na rede pública, a família receberá um voucher-creche para acesso à rede privada credenciada até a vaga pública surgir, para que nenhuma mulher deixe de trabalhar, estudar ou empreender por falta de creche.
  meta: null
  condicionalidade: null
- id: pl-educacao-011
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: ensino-medio-e-tecnico
  rotulo: Ampliar a educação técnica no ensino médio, em parceria com o setor produtivo
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 36
    secao: Brasil que Prepara > Preparar para o trabalho que existe
    literal: Vamos ampliar a oferta de educação técnica para os alunos do ensino médio, para que o jovem saia da escola já com uma profissão na mão, e não apenas com um diploma. E vamos fazer essa formação técnica em parceria com o setor produtivo, com foco na inovação, de modo que quem forma o profissional converse diretamente com quem vai contratá-lo. Nessa parceria, o setor produtivo poderá custear bolsas de formação técnica, financiando a qualificação dos profissionais de que precisa.
  meta: null
  condicionalidade: null
- id: pl-educacao-012
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: ensino-medio-e-tecnico
  rotulo: Criar a Política Nacional de Formação de Talentos
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 36
    secao: Brasil que Prepara > Preparar para o trabalho que existe
    literal: Vamos tratar a formação como vetor da transformação tecnológica, adequando o que se ensina às profissões do presente e do futuro, e criar a Política Nacional de Formação de Talentos, para identificar e desenvolver as habilidades que o mercado de trabalho vai exigir.
  meta: null
  condicionalidade: null
- id: pl-educacao-013
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: ensino-superior
  rotulo: Unificar ciência e ensino superior no Ministério da Ciência e priorizar impacto produtivo
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 36
    secao: Brasil que Prepara > Preparar para o trabalho que existe
    literal: No ensino superior, vamos transferir a governança para o Ministério da Ciência, Tecnologia e Inovações, unificando ciência e ensino superior sob o mesmo teto. A CAPES e o CNPq passarão a priorizar o impacto produtivo, a inovação e a transferência de tecnologia, para que a pesquisa feita na universidade chegue à indústria e vire produto, emprego e renda, em vez de ficar na estante. E os cursos de pós-graduação voltados ao mercado, o lato
  - documento: plano-pl-2026
    pagina_impressa: 37
    secao: Brasil que Prepara > Preparar para o trabalho que existe
    literal: 'sensu, vão aproximar empresas e universidades: as instituições de ensino poderão receber recursos em troca da formação dos profissionais de que o país precisa, premiando quem forma para o emprego que existe.'
  meta: null
  condicionalidade: null
- id: pl-educacao-014
  candidato: flavio-bolsonaro
  eixo: educacao
  topico: ensino-superior
  rotulo: Adotar o Empréstimo Contingente à Renda no financiamento estudantil
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 37
    secao: Brasil que Prepara > Preparar para o trabalho que existe
    literal: 'Vamos também aprimorar o financiamento estudantil. O modelo atual afasta o jovem de baixa renda, que desiste da faculdade com medo de terminar o curso afogado em dívida, antes mesmo do primeiro emprego. Em lugar dele, vamos adotar o Empréstimo Contingente à Renda: o estudante só começa a pagar quando estiver empregado e ganhando, o valor da parcela é proporcional ao que ele recebe e o prazo é bem mais longo.'
  meta: null
  condicionalidade: null
