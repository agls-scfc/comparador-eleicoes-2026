    secao: 4. Garantir o Direito à Educação para Transformar Vidas e o País
    literal: Aprovamos a nova lei do ensino médio, buscando reequilibrar a formação geral básica e a formação profissional, e criamos o Pé-de-Meia, para enfrentar o desafio da evasão no ensino médio. O programa já beneficiou 7,3 milhões de jovens e mostrou ter impacto sobre os indicadores de permanência e de participação no Enem.
  meta: null
