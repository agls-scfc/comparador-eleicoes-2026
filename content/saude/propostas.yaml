- id: pt-saude-014
  candidato: lula
  eixo: saude
  topico: filas-e-atencao-especializada
  rotulo: Consolidar a rede pública de cuidado ao câncer e ampliar UNACONS e CACONS
  tipo: compromisso
  trechos:
  - documento: plano-pt-2026
    pagina_impressa: 38
    secao: 5. Fortalecer a saúde com equidade, inovação e soberania
    literal: Vamos consolidar, em todo o Brasil, a maior rede pública de cuidado ao câncer do mundo, com prevenção, diagnóstico e tratamento ao câncer com equipamentos e tratamentos modernos e atualização de novos medicamentos quimioterápicos e imunoterápicos. Consolidaremos o Supercentro Brasil de telediagnóstico do câncer, reduzindo o tempo para realização de diagnóstico das biopsias nas regiões remotas ou com déficit de profissionais. Ampliaremos os Centros Especializados de diagnóstico e tratamento do câncer (UNACONS e CACONS), com expansão de centros de radioterapia e cirurgias.
  meta: null
  condicionalidade: null
