    pagina_impressa: 37
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: 'Para usar bem o que já existe, vamos contratar serviços e exames na rede privada nos horários ociosos: há aparelho parado enquanto gente espera meses pelo mesmo exame, e aproveitar essa capacidade é atender mais sem'
  - documento: plano-pl-2026
    pagina_impressa: 38
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: construir do zero.
  meta: null
