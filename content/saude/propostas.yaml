    pagina_impressa: 39
    secao: 5. Fortalecer a saúde com equidade, inovação e soberania
    literal: Foram assinadas 31 parcerias para desenvolvimento produtivo a partir de 2024, entre as quais para a volta de produção nacional de insulina, e aprovados 54 Programas de Desenvolvimento e Inovação Local. Concluímos a fábrica Hemobrás, que nos coloca rumo a nacionalização completa da produção de hemoderivados, ampliando nossa soberania nesse tipo de insumo.
