    pagina_impressa: 35
    secao: 5. Fortalecer a saúde com equidade, inovação e soberania
    literal: Um dos mais importantes avanços no sistema, que já começamos a implementar e ganhará velocidade e escala na próxima gestão, é a integração entre a Atenção Primária, a Vigilância em Saúde, a Assistência Farmacêutica e a Atenção Especializada, com prontuário compartilhado, fluxos claros de referência e contrarreferência e articulação com as Ofertas de Cuidados Integrados (OCI), propiciando o conhecimento e a articulação do cuidado ao longo de toda a trajetória do usuário na rede.
