    pagina_impressa: 37
    secao: 5. Fortalecer a saúde com equidade, inovação e soberania
    literal: Continuaremos investindo para garantir à rede pública equipamentos modernos e em número suficiente para atender a população. Será nossa diretriz continuar ampliando e modernizando equipamentos de hemodinâmica, tomografia,
