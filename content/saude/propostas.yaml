  eixo: saude
  topico: filas-e-atencao-especializada
  rotulo: Fortalecer a Rede Nacional de Hospitais Inteligentes (EBSERH)
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 38
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: Vamos também fortalecer a Rede Nacional de Hospitais Inteligentes (EBSERH), modernizando os hospitais universitários federais.
  meta: null
  condicionalidade: null
- id: pl-saude-006
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-digital-e-prontuario
  rotulo: Telessaúde e teleatendimento por aplicativo para regiões com filas longas
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 38
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: Vamos também levar o atendimento até quem não consegue chegar até ele. Com a telessaúde e o teleatendimento por aplicativo, médicos de regiões com baixa demanda poderão atender pacientes onde as filas são longas, aproximando o cuidado de quem vive longe de um grande centro.
  meta: null
  condicionalidade: null
- id: pl-saude-007
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-digital-e-prontuario
  rotulo: Inteligência artificial de apoio à prevenção
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 38
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: Com inteligência artificial de apoio à prevenção, o sistema poderá identificar quem corre maior risco de adoecer e chamar essa pessoa para se cuidar a tempo, em vez de esperar que ela chegue ao pronto-socorro quando já é grave.
  meta: null
  condicionalidade: null
- id: pl-saude-008
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-digital-e-prontuario
  rotulo: Implantar o prontuário eletrônico único, vinculado ao CPF e ao Gov.br
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 26
    secao: Brasil sem Fila > Saúde digital e prontuário eletrônico único
    literal: Vamos implantar o prontuário eletrônico único, vinculado ao CPF e integrado ao Gov.br, interoperável entre as redes pública e privada, com histórico completo de consultas, exames, vacinas e prescrições, sempre observados o consentimento do paciente, a LGPD, o sigilo médico e os protocolos de segurança
  meta: null
  condicionalidade: null
- id: pl-saude-009
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-digital-e-prontuario
  rotulo: Completar a digitalização do SUS e usar IA no agendamento
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 26
    secao: Brasil sem Fila > Saúde digital e prontuário eletrônico único
    literal: Junto disso, vamos completar a digitalização do SUS e usar inteligência artificial para agilizar o agendamento de consultas e exames, ajudando a encaixar o paciente na primeira vaga disponível, para que ninguém mais fique meses aguardando uma marcação que poderia ser resolvida em muito menos tempo.
  meta: null
  condicionalidade: null
- id: pl-saude-010
  candidato: flavio-bolsonaro
  eixo: saude
  topico: medicamentos-e-farmacia-popular
  rotulo: Sistema de entrega de remédio em domicílio
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 38
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: E um sistema de entrega de remédio em domicílio vai garantir que o idoso, a pessoa com deficiência e o doente crônico não precisem escolher entre buscar o tratamento e pagar o transporte.
  meta: null
  condicionalidade: null
- id: pl-saude-011
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-da-mulher
  rotulo: Saúde da mulher preventiva, por telemedicina e com prontuário integrado
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 21
    secao: Brasil por Elas > Saúde para Elas
    literal: Vamos cuidar da saúde da mulher de forma preventiva, sem fila longa, com atendimento perto de casa e também pelo celular, por telemedicina ou em postos de saúde que vamos ampliar e construir. O prontuário eletrônico integrado garantirá rastreamento e acompanhamento ao longo da vida, através de um banco de dados da saúde que conectará médicos de diferentes especialidades, e a mulher não perderá mais o dia inteiro de trabalho para cuidar da própria saúde.
  meta: null
  condicionalidade: null
- id: pl-saude-012
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-da-mulher
  rotulo: Ampliar exames preventivos para a mulher e criar Unidades Móveis de Saúde da Mulher
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 21
    secao: Brasil por Elas > Saúde para Elas
    literal: Vamos ampliar o acesso a exames preventivos, cuidando da mulher com câncer, na menopausa, na gestação ou que sofre de endometriose, por exemplo, e dar acesso também à saúde bucal. E teremos Unidades Móveis de Saúde da Mulher, ônibus ou caminhões adaptados que percorrerão o país, além de barcos adaptados para atender a população ribeirinha.
  meta: null
  condicionalidade: null
- id: pl-saude-013
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-mental-e-cuidado
  rotulo: Casa Segura para Envelhecer e aplicativo de companhia para idosos
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 39
    secao: Brasil que Prepara > Cuidar de quem a gente ama
    literal: Por isso, para a população idosa, vamos oferecer o programa Casa Segura para Envelhecer, com subsídio à acessibilidade domiciliar para famílias de menor renda. Desenvolveremos um aplicativo de companhia com alertas de perigo, para que o idoso tenha o amparo da tecnologia e o filho que mora longe tenha tranquilidade.
  meta: null
  condicionalidade: null
- id: pl-saude-014
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-mental-e-cuidado
  rotulo: Ampliar as instituições de longa permanência para idosos
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 39
    secao: Brasil que Prepara > Cuidar de quem a gente ama
    literal: E vamos ampliar as instituições de longa permanência para idosos, para que recebam proteção especial quando o cuidado familiar não for viável ou suficiente.
  meta: null
  condicionalidade: null
- id: pl-saude-015
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-mental-e-cuidado
  rotulo: Políticas transversais para pessoas com deficiência, com Centros de Referência em TEA
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 39
    secao: Brasil que Prepara > Cuidar de quem a gente ama
    literal: Nossas políticas serão transversais, atravessando todas as áreas do governo, voltadas a ações concretas de garantia de direitos, inclusão e integração social, entre elas a implantação de Centros de Referência em Transtorno do Espectro Autista.
  meta: null
  condicionalidade: null
- id: pl-saude-016
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-mental-e-cuidado
  rotulo: 'Fortalecer a atenção à saúde mental: TDAH, depressão, ansiedade e Alzheimer'
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 39
    secao: Brasil que Prepara > Cuidar de quem a gente ama
    literal: 'Vamos fortalecer e ampliar a atenção à saúde mental, chegando às famílias que muitas vezes enfrentam tudo sozinhas: o diagnóstico precoce e o apoio às crianças com TDAH; a atenção à depressão e à ansiedade; e o cuidado com os idosos que enfrentam o Alzheimer e outras doenças neurológicas, e com quem cuida deles.'
  meta: null
  condicionalidade: null
- id: pl-saude-017
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-mental-e-cuidado
  rotulo: Estruturar a Rede Nacional de Cuidado com centros-dia e atendimento domiciliar
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 21
    secao: Brasil por Elas > Creche garantida para toda criança
    literal: Também estruturaremos uma Rede Nacional de Cuidado, ampliando o apoio a idosos e pessoas com deficiência, com centros-dia e atendimento domiciliar em parcerias público privado com estados, municípios e organizações sociais.
  meta: null
  condicionalidade: null
- id: pl-saude-018
  candidato: flavio-bolsonaro
  eixo: saude
  topico: saude-digital-e-prontuario
  rotulo: Governo Bolsonaro criou o Conecte SUS e a rede nacional de dados de saúde
  tipo: resultado_declarado
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 26
    secao: Brasil sem Fila > Saúde digital e prontuário eletrônico único
    literal: 'Esse trabalho foi iniciado no Governo Bolsonaro: criamos o Conecte SUS e a rede nacional que deu ao cidadão acesso ao seu histórico e começou a conectar os sistemas de saúde do país.'
  meta: null
