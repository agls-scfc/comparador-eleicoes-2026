- id: pl-saude-001
  candidato: flavio-bolsonaro
  eixo: saude
  topico: financiamento-sus-e-industria
  rotulo: Garantir a correção efetiva da tabela SUS
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 37
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: Vamos garantir as condições para que seja possível a correção efetiva da tabela SUS. A lei de reajuste já existe, mas, presa ao orçamento, não enfrentou a defasagem que asfixia hospitais, santas casas e clínicas, sobretudo no interior. Vamos assegurar uma remuneração que cubra o custo real do atendimento, para que o dinheiro público seja justo com quem atende e o cidadão tenha atendimento até onde hoje falta.
  meta: null
  condicionalidade: null
- id: pl-saude-002
  candidato: flavio-bolsonaro
  eixo: saude
  topico: atencao-basica-e-acesso
  rotulo: Ampliar a Estratégia Saúde da Família e criar o Programa de Atendimento aos Idosos
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 37
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: Vamos ampliar a Estratégia Saúde da Família, levando o cuidado para perto de casa, e criar o Programa de Atendimento aos Idosos, com atendimento facilitado e adequado a quem envelhece, para que o idoso não enfrente o mesmo percurso cansativo de sempre para se cuidar.
  meta: null
  condicionalidade: null
- id: pl-saude-003
  candidato: flavio-bolsonaro
  eixo: saude
  topico: vacinacao-e-prevencao
  rotulo: Ampliar exames preventivos; manter imunização e incentivo à produção nacional de vacinas
  tipo: compromisso
  trechos:
  - documento: plano-pl-2026
    pagina_impressa: 37
    secao: Brasil que Prepara > Saúde que cuida antes de a doença chegar
    literal: Vamos ainda ampliar o acesso a exames preventivos e manter a imunização e o incentivo à produção nacional de vacinas, porque prevenir é sempre mais barato e mais humano do que tratar tarde.
  meta: null
  condicionalidade: null
- id: pl-saude-004
  candidato: flavio-bolsonaro
  eixo: saude
  topico: filas-e-atencao-especializada
  rotulo: Contratar exames e serviços da rede privada nos horários ociosos
